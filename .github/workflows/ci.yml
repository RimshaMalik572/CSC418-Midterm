
name: Assignment Portal CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Prepare report file
        run: touch test-results.tap

      - name: Start Assignment Portal Server
        id: server
        continue-on-error: true
        run: |
          node server.js > server.log 2>&1 &
          for i in {1..15}; do
            if curl -fsS http://localhost:3000/ > /dev/null; then
              echo "Server started successfully"
              exit 0
            fi
            sleep 1
          done
          cat server.log
          exit 1

      - name: Run automated tests
        id: tests
        if: steps.server.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          node --test --test-reporter=tap tests/*.test.js | tee test-results.tap

      - name: Generate test report
        if: always()
        run: node scripts/create-report.js

      - name: Send report to local computer
        if: always()
        env:
          REPORT_TOKEN: ${{ secrets.REPORT_TOKEN }}
          REPORT_URL: ${{ secrets.REPORT_RECEIVER_URL }}
        run: |
          curl --fail-with-body --max-time 30 \
            -X POST "$REPORT_URL/report" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $REPORT_TOKEN" \
            --data-binary @test-report.json

      - name: Email test report
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "CSC418 CI Test Report - ${{ job.status }}"
          to: ${{ secrets.GMAIL_USERNAME }}
          from: ${{ secrets.GMAIL_USERNAME }}
          body: |
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Workflow Run: ${{ github.run_id }}
            Status: ${{ job.status }}
          attachments: test-report.json

      - name: Fail workflow if tests or server failed
        if: always()
        run: |
          if [ "${{ steps.server.outcome }}" != "success" ] || [ "${{ steps.tests.outcome }}" != "success" ]; then
            echo "Server or automated tests failed"
            exit 1
          fi
